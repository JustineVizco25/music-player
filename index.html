<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="A Christmas music player with shuffle, repeat, and an interactive playback timeline, built with HTML, CSS, and JavaScript.">
        <title>Christmas Music Player</title>
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23202020'/%3E%3Cpath d='M25 16v29a7 7 0 1 1-4-6V20l26-6v25a7 7 0 1 1-4-6V12Z' fill='%23ff5555'/%3E%3C/svg%3E">
        <link rel="stylesheet" href="music-player.css">
    </head>
    <body>
        <main id="music-player" aria-label="Christmas music player">
            <img id="song-image" src="./song-images/underneath-the-tree.jpeg" alt="Underneath the Tree by Kelly Clarkson" width="300" height="300">
            <h1 id="song-name">Underneath the Tree</h1>
            <p id="song-artist">Kelly Clarkson</p>

            <input id="song-slider" type="range" min="0" max="0" value="0" step="0.1" aria-label="Playback position" aria-valuetext="0:00 of 0:00" disabled>

            <div id="song-time" aria-hidden="true">
                <span id="current-time">0:00</span>
                <span id="total-duration">0:00</span>
            </div>

            <div id="music-buttons" role="group" aria-label="Playback controls">
                <button id="shuffle-song" type="button" aria-label="Shuffle" aria-pressed="false" title="Shuffle">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h3c4 0 8 12 12 12h3M17 14l4 4-4 4M3 18h3c1.8 0 3.5-2.4 5.2-5M14 8c1.4-1.3 2.6-2 4-2h3M17 2l4 4-4 4"/></svg>
                </button>
                <button id="prev-song" type="button" aria-label="Previous track" title="Previous track">
                    <svg class="skip-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M20 4 8 12l12 8Z"/></svg>
                </button>
                <button id="playpause-song" type="button" aria-label="Play" title="Play">
                    <svg class="play-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21"/><path id="play-symbol" d="m20 15 13 9-13 9Z"/><path id="pause-symbol" d="M19 16v16M29 16v16" hidden/></svg>
                </button>
                <button id="next-song" type="button" aria-label="Next track" title="Next track">
                    <svg class="skip-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 12 8-12 8ZM19 4v16"/></svg>
                </button>
                <button id="repeat-song" type="button" aria-label="Repeat track" aria-pressed="false" title="Repeat track">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>
                </button>
            </div>
            <p id="player-status" role="status" aria-live="polite"></p>
            <audio id="audio" preload="metadata"></audio>
        </main>
        <script src="music-player.js"></script>
    </body>
</html>
